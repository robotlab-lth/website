---
layout: default
---
<div class="pagebody">
  <div class="wrap">
    <div class="breadcrumb">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a> &gt;
      <a href="{{ '/news/' | relative_url }}">News</a> &gt; {{ page.title }}
    </div>
    <div class="columns">
      <main class="content">
        <div class="content-inner">
          <h1 class="page-title">{{ page.title }}</h1>
          <p class="news-date">{{ page.date | date: "%Y-%m-%d" }}</p>
          {{ content }}
          <p><a href="{{ '/news/' | relative_url }}">&laquo; All news</a></p>
        </div>
      </main>
    </div>
  </div>
</div>
