<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/rss-theme.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  {%- for href in page.extra_css %}
  <link rel="stylesheet" href="{{ href | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  {%- endfor %}
  {%- feed_meta -%}
</head>
<body id="top">

<a class="skip" href="#main-content">Skip to main content</a>

{% include topstrip.html %}
{% include masthead.html %}
{% include nav.html %}

{{ content }}

{% include footer.html %}

<script src="{{ '/assets/js/slider.js' | relative_url }}"></script>
<script src="{{ '/assets/js/nav.js' | relative_url }}"></script>
{%- for src in page.extra_js %}
<script src="{{ src | relative_url }}"></script>
{%- endfor %}
</body>
</html>
