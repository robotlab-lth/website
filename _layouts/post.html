---
layout: default
---
<div class="wrap">
  <div class="breadcrumb">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a> &gt;
    <a href="{{ '/news/' | relative_url }}">News</a> &gt; {{ page.title }}
  </div>
  <div class="columns">
    <main class="content" id="main-content">
      <h1 class="page-title">{{ page.title }}</h1>
      <p class="news-date">{{ page.date | date: "%Y-%m-%d" }}</p>
      {%- assign post_image = page.image | default: site.data.images.robotlab_photo -%}
      <figure class="post-image">
        <img src="{{ post_image }}" alt="{{ page.image_alt | default: page.title }}">
      </figure>
      {{ content }}
      <p><a href="{{ '/news/' | relative_url }}">All news</a></p>
    </main>
  </div>
</div>
