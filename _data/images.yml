# Images reused from the sibling site www.robotics.lth.se (RobotLab LTH),
# which runs the same Lund University design. All URLs below were taken from
# live pages on www.robotics.lth.se, so every image reference resolves.
#
# To make the site self-contained, download each file into assets/img/ and
# change the value here to a local path, e.g. /assets/img/lth-logo.svg:
#
#   curl -o assets/img/lth-logo.svg \
#     "https://www.robotics.lth.se/themes/custom/lu_theme/images/logos/logo__default--right_lth_en.svg"
#
# Every logo reference keeps a local placeholder as an onerror fallback, so a
# broken or expired URL degrades to the placeholder instead of a missing image.

# Logotypes
lth_logo: "https://www.robotics.lth.se/themes/custom/lu_theme/images/logos/logo__default--right_lth_en.svg"
lth_logo_negative: "https://www.robotics.lth.se/sites/robotics.lth.se/files/LTH-NEG-ENG.svg"

