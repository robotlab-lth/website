<header class="masthead">
  <div class="wrap">
    <div>
      <h1 class="masthead-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="masthead-sub">{{ site.tagline }}</p>
    </div>
    <div class="masthead-logo">
      <a href="https://www.lu.se/">
        <img src="{{ '/assets/img/lu-logo.svg' | relative_url }}" alt="Lund University">
      </a>
    </div>
  </div>
</header>
