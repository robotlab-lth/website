title: Robotics and Semantic Systems
tagline: Computer Science | LTH | Lund University
description: >-
  Research group in robotics, artificial intelligence and natural language
  processing at the Department of Computer Science, Lund University.
email: expedition@cs.lth.se

# ---------------------------------------------------------------------------
# URL settings
#
# User/organisation site (https://<user>.github.io):
#     url: "https://<user>.github.io"
#     baseurl: ""
#
# Project site (https://<user>.github.io/<repo>):
#     url: "https://<user>.github.io"
#     baseurl: "/<repo>"
# ---------------------------------------------------------------------------
url: ""
baseurl: ""

# ---------------------------------------------------------------------------
# Theme
#
# This repository is its own theme: _layouts, _includes and
# assets/css/style.scss define the whole design, so no `theme:` line is needed
# and none of the supported themes is loaded.
#
# To adopt a theme later:
#   supported theme  ->  theme: jekyll-theme-minimal
#   any GitHub theme ->  remote_theme: owner/repository
#                        (also add jekyll-remote-theme to `plugins` and the
#                         Gemfile, and set Pages to build with Actions)
# Files in _layouts, _includes and assets always win over the theme's own
# versions, so the design here survives either switch.
# ---------------------------------------------------------------------------

# Stylesheet: assets/css/style.scss is compiled to /assets/css/style.css
sass:
  style: expanded

# News on the front page
paginate: 5
paginate_path: "/news/page:num/"
permalink: /news/:year/:month/:day/:title/

# Every top menu item is a collection. Add a .md file to the matching folder
# and a new page appears in that category and in its left-hand menu.
collections:
  research:
    output: true
    permalink: /research/:name/
  education:
    output: true
    permalink: /education/:name/
  publications:
    output: true
    permalink: /publications/:name/
  people:
    output: true
    permalink: /people/:name/
  about:
    output: true
    permalink: /about/:name/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "research" }
    values: { layout: "page", category_name: "Research" }
  - scope: { path: "", type: "education" }
    values: { layout: "page", category_name: "Education" }
  - scope: { path: "", type: "publications" }
    values: { layout: "page", category_name: "Publications" }
  - scope: { path: "", type: "people" }
    values: { layout: "person", category_name: "People", hidden: true }
  - scope: { path: "", type: "about" }
    values: { layout: "page", category_name: "About" }

# All three are on the GitHub Pages allow-list, so the site builds whether you
# deploy with Actions or with "Deploy from a branch".
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  # - jekyll-remote-theme   # only needed if you set remote_theme above

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - templates
  - preview.html
  - vendor
